    <div class="container">
        <h1>Kontakt</h1>
        <p class="subtitle">Lass uns in Verbindung treten.</p>

        <!-- Die Kontakt-Karte (zentriert) -->
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <!-- Das Kontakt-Formular -->
            <!-- Das 'action' Attribut schickt die Daten an Formspree -->
            <form action="https://formspree.io/f/moeqyllb" method="POST">
                
                <label for="name">Dein Name</label>
                <!-- Wichtig: 'name' Attribute hinzugefügt, damit Formspree weiß, was was ist -->
                <input type="text" id="name" name="Name" placeholder="Wie heißt du?" required>

                <label for="email">Deine E-Mail</label>
                <input type="email" id="email" name="Email" placeholder="name@beispiel.de" required>

                <label for="message">Nachricht</label>
                <textarea id="message" name="Nachricht" rows="5" placeholder="Was gibt's Neues?" required></textarea>

                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; font-size: 16px;">Nachricht senden</button>
            </form>
        </div>
    </div>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 – Leon Thein</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        (function () {
            var d = document.documentElement, t = null, l = null;
            try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            if (!l) l = (navigator.language || 'de').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
            d.setAttribute('data-theme', t);
            d.setAttribute('data-lang', l);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600&family=Geist+Mono:wght@300;400&family=Instrument+Serif:ital@1&display=swap">
    <link rel="stylesheet" href="/style.css">
</head>
<body data-page="404">
    <div class="curtain" id="curtain"></div>
    <div class="cursor" id="cursor"><span id="cursor-label"></span></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="nf">
        <canvas id="globe" aria-hidden="true"></canvas>
        <div class="wrap">
            <p class="mono muted fade-in" style="--d:.2s" data-i18n="nf.title">Vom Weg abgekommen.</p>
            <h1 class="fade-in" style="--d:.35s">404</h1>
            <div class="nf-row fade-in" style="--d:.5s">
                <p class="lead" data-i18n="nf.text">Diese Seite gibt es nicht (mehr).</p>
                <a href="/" class="btn btn-solid magnetic"><span data-i18n="nf.home">Zur Startseite</span><span class="arrow">→</span></a>
            </div>
        </div>
    </main>

    <script src="/i18n.js" defer></script>
    <script src="/script.js" defer></script>
</body>
</html>
